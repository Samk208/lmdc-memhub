# CodeRabbit configuration for this plugin repository
reviews:
  auto_review:
    enabled: true
    drafts: false
  high_level_summary: true
  tools:
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    phpcs:
      enabled: true

# Limit reviews to relevant code; ignore docs and Markdown entirely
path_filters:
  - "**/*.php"
  - "assets/**"
  - "src/**"
  - "!docs/**"
  - "!**/*.md"
  - "!**/*.mdx"
  - "!node_modules/**"
  - "!vendor/**"
